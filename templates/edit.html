<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f6f8;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Student</h1>

    <form action="/update/{{ student.student_id }}" method="POST">

        <label>Name</label>
        <input
            type="text"
            name="name"
            value="{{ student.name }}"
            required
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            value="{{ student.email }}"
            required
        >

        <label>Course</label>
        <input
            type="text"
            name="course"
            value="{{ student.course }}"
            required
        >

        <label>Age</label>
        <input
            type="number"
            name="age"
            value="{{ student.age }}"
            required
        >

        <button type="submit">Update Student</button>

    </form>

    <a class="back" href="/">← Back to Students</a>

</div>

</body>
</html>
